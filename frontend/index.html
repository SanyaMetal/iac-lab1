<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторная работа № 1</title>
    <style>
        body {
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px;
            font-family: sans-serif;
            background: #f4f6f8;
            color: #202830;
        }

        main {
            padding: 30px;
            background: white;
            border-radius: 12px;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #result {
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <main>
        <h1>Инфраструктура как код</h1>
        <p>Фронтенд работает в контейнере Nginx.</p>

        <button id="request" type="button">
            Проверить бэкенд
        </button>

        <p id="result">Нажмите кнопку для отправки запроса.</p>
    </main>

    <script>
        const button = document.getElementById("request");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {
            button.disabled = true;
            result.textContent = "Выполняется запрос...";

            try {
                const response = await fetch("/api/message");

                if (!response.ok) {
                    throw new Error(`Код ответа: ${response.status}`);
                }

                const data = await response.json();

                result.textContent =
                    `${data.message}\nИмя контейнера: ${data.hostname}`;
            } catch (error) {
                result.textContent = `Ошибка: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
